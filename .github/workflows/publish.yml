name: Render and deploy

# Every push to main re-renders the site and publishes it to the gh-pages
# branch. You never run `quarto publish` by hand again: writing -> git push.
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: write           # allows the action to push to the gh-pages branch

# Only one deploy at a time. A newer push cancels an in-progress build so we
# never waste minutes rendering a commit that is already superseded.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python (for runnable code cells)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip                 # reuse the pip download cache between runs
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run fast pre-publish checks
        run: python tools/check.py --fast

      # Posts set `freeze: auto`, so committed _freeze/ output is reused and only
      # posts whose source changed are re-executed. Keep _freeze/ committed.
      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
