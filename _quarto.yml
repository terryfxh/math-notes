project:
  type: website
  output-dir: _site
  # Only turn these into web pages. Helper docs (README, WORKFLOW, TODO,
  # quotes, ideas) stay in the repo but are NOT published as pages.
  render:
    - "*.qmd"
    - "posts/"

website:
  title: "(Terry) Xihan Fang — Math Notes"
  description: "Self-contained notes in pure and applied mathematics, derived from first principles with runnable code where it helps."
  site-url: https://terryfxh.github.io/math-notes   # project-page URL
  repo-url: https://github.com/terryfxh/math-notes
  repo-actions: [issue]
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/terryfxh
        aria-label: GitHub
  page-footer:
    border: true
    left: "© 2026 Terry Fang · All rights reserved · Reproduction or republication in any form requires attribution and the author's prior permission."
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - tokens/colors.css
      - tokens/typography.css
      - tokens/spacing.css
      - styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    html-math-method: mathjax
    fig-cap-location: bottom
    link-external-newwindow: true

# Bibliography defaults (used by any post that cites)
bibliography: references.bib
csl: ieee.csl

# Theorem/proof environments and cross-reference labels
crossref:
  thm-title: "Theorem"
  lem-title: "Lemma"
  cor-title: "Corollary"
  def-title: "Definition"
  prp-title: "Proposition"
